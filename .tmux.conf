# ==============
#  tmux config
# for tmux v3.2+
# ============== 


# ############## #
# Global options #
# ############## #

## Default shell
set-option -g default-shell /bin/bash

## Prefix depending on designated tmux nesting level.
##
## TMUX_NESTING_LEVEL=0 -> ALT+w
## TMUX_NESTING_LEVEL=1 -> CTRL+b
## TMUX_NESTING_LEVEL=2 -> CTRL+b
##
## If the variable is not set, default to nesting level 0.

set -ag update-environment " TMUX_NESTING_LEVEL"

if-shell '[ "${TMUX_NESTING_LEVEL:-0}" -eq 0 ]' \
    'unbind-key C-b; set -g prefix M-w; bind M-w send-prefix' \
    'unbind-key M-w; set -g prefix C-b; bind C-b send-prefix'

## Allow opening multiple terminals to view the same session at different sizes.
#setw -g aggressive-resize on

## Remove delay when switching between Vim modes.
#set -sg escape-time 1
set -sg escape-time 0

## Allow Vim's FocusGained to work when your terminal gains focus.
### Requires Vim plugin: https://github.com/tmux-plugins/vim-tmux-focus-events
set -g focus-events on

## Add a bit more scroll history in the buffer.
set -g history-limit 50000

## Enable color support inside of tmux.
#set -g default-terminal "tmux-256color"
set -g default-terminal "xterm"

# Configuration of outer terminal (like MobaXTerm) for multiple Client setups
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

## xterm compatible control arrow keys. (works with Vim)
setw -g xterm-keys on

# vi mode
setw -g mode-keys vi

## Rename window titles automatically.
setw -g automatic-rename

## Window index numbers reordered on delete.
#set-option -g renumber-windows on

## Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

## Enable full mouse support.
set -g mouse on

## Keybinding to enter copy-mode
### I do not like the default keybinding of `<leaderkey>[`, where `[` requires cumbersome `<AltGr> + 9` keypress on a german keyboard.
### Replacing default keybinding with `<leaderkey> <Alt>+s`
bind-key M-s copy-mode
### Creating a new keybinding for "tmux kill-session"
bind-key C-k kill-session

## Set personal theme
#set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin "nordtheme/tmux"


# ############ #
# Key bindings #
# ############ #

# Unbind default keys
## unbind C-b
### unbind '"'
### unbind %

# Key to reload the tmux configuration
bind-key r source-file ~/.tmux.conf


# -------------------
# Key bindings: Panes
# -------------------

## Split panes & create new terminal at current directory.

### The standard for horizontal split is: <leaderkey> + "
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

### The standard for vertical split is: <leaderkey> + %
bind-key % split-window -h -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

## Move around panes with ALT + arrow keys.
bind-key -n M-Up select-pane -U
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Right select-pane -R

## Move panes inside the same Window. Key "j" meaning "join panes"
bind-key j \
    select-pane -m \; \
    display-menu -T "Move pane" \
        "Left"  l "display-panes -d 0 \"join-pane -hb -s '{marked}' -t '%%' \\; select-pane -M\"" \
        "Right" r "display-panes -d 0 \"join-pane -h  -s '{marked}' -t '%%' \\; select-pane -M\"" \
        "Above" k "display-panes -d 0 \"join-pane -vb -s '{marked}' -t '%%' \\; select-pane -M\"" \
        "Below" j "display-panes -d 0 \"join-pane -v  -s '{marked}' -t '%%' \\; select-pane -M\""


# ---------------------
# Key bindings: Windows
# ---------------------

## create new windows with current directory
bind c new-window -c "#{pane_current_path}"

## swap the window numbers of 2 windows
bind-key s command-prompt -p "swap-window from: " \
  "command-prompt -p 'swap-window to: ' \
  \"run-shell 'tmux swap-window -s \"%%\" -t \"%%\"'\""

# ######################### #
# tpm - tmux plugin manager #
# ######################### #

## https://github.com/tmux-plugins/tpm
### 1) git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
### 2) Reload config file using  `<leaderkey>r`
### 3) `I` (capital i) to fetch plugins

# Github URLs of plugins - configured via tpm 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/vim-tmux-focus-events'
# Initialize TPM (after plugin specification) 
run '~/.tmux/plugins/tpm/tpm'

# Configure tmux-resurrect

# Where tmux-resurrect stores snapshots
set -g @resurrect-dir '~/.tmux/resurrect'

# Configure number of days of retention for snapshots:
set -g @resurrect-delete-backup-after '7'

# (Optional) keep your "save with a name" binding as-is:
# This prompts for a name, saves to 'last', then copies it to that name.
unbind C-s
bind C-s command-prompt -I "#{session_name}" -p "Save name:" "run-shell '~/.tmux/bin/tmux_named_resurrect_save.sh %1 #{?@resurrect-dir,#{@resurrect-dir},#{home}/.tmux/resurrect}'"

# Replace the old named-restore on Ctrl-r with an fzf picker
unbind -n C-r
unbind C-r
bind C-r display-popup -w 80% -h 80% -E "~/.tmux/bin/tmux_named_resurrect_restore.sh #{?@resurrect-dir,#{@resurrect-dir},#{home}/.tmux/resurrect}"

